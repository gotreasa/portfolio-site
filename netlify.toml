# THE PRESENCE ARTIFACT IS FETCHED BEFORE EVERY BUILD.
#
# `data/presence.json` carries the values this site shares with the CV and the
# LinkedIn profile: identity, prose blocks and the career record. It is generated
# from a private source of truth and published at github.com/gotreasa/presence.
#
# PINNED TO A TAG, NEVER A BRANCH TIP (PS-015). A build must produce the same
# site tomorrow as it does today from the same commit, and `main` would make that
# false. Moving to a newer artifact is an edit to this file, which is the point:
# it is a decision with a diff, not something that happens while nobody is
# looking.
#
# `-f` IS LOAD-BEARING. Without it curl writes a 404 body to the output file and
# exits 0, so the build would carry on and deploy a site whose data file contains
# an HTML error page. With it, a fetch failure fails the build. A deploy that
# stops is recoverable; one that silently ships wrong data is not.
#
# `--retry` covers a transient network blip without covering a wrong URL: retries
# apply to transient failures, and a 404 still fails.
#
# TO UPDATE: publish a new tag in the presence repository, change the tag here,
# commit. To check what a tag holds before pointing at it, fetch that URL by hand.

[build]
  command = "curl -fsSL --retry 3 --retry-delay 2 -o data/presence.json https://raw.githubusercontent.com/gotreasa/presence/v5/presence.json && hugo"
  publish = "public"

[build.environment]
  # Must be >= 0.146.0: toha v4.10.0 refuses to load below that, and the
  # build fails with "Module github.com/hugo-toha/toha/v4 is not compatible
  # with this Hugo version". This pinned 0.145.0 while commit 9322753
  # upgraded the theme "for Hugo 0.165 compatibility" without bumping it, so
  # production would have failed on the next push. Found 30 Aug 2026 by
  # building with the pinned version rather than reasoning about it.
  #
  # 0.165.0 is the version the site is actually developed and tested on.
  HUGO_VERSION = "0.165.0"

[context.production]
  command = "curl -fsSL --retry 3 --retry-delay 2 -o data/presence.json https://raw.githubusercontent.com/gotreasa/presence/v5/presence.json && hugo -b https://gearoid.eu --minify"

[context.deploy-preview]
  command = "curl -fsSL --retry 3 --retry-delay 2 -o data/presence.json https://raw.githubusercontent.com/gotreasa/presence/v5/presence.json && hugo -b $DEPLOY_PRIME_URL --minify"

[build.processing]
  skip_processing = false
[build.processing.css]
  minify = true
  bundle = false
[build.processing.js]
  minify = true
  bundle = false

# Config for the Netlify Build Plugin: netlify-plugin-minify-html
[[plugins]]
  package = "netlify-plugin-minify-html"

  # Specify which deploy contexts we'll minify HTML in.
  # Supports any Deploy Contexts available in Netlify.
  # https://docs.netlify.com/site-deploys/overview/#deploy-contexts
  [plugins.inputs]
    contexts = [
      'production',
      'branch-deploy',
      'deploy-preview'
    ]

  # Optionally, override the default options for the minification
  # https://github.com/kangax/html-minifier#options-quick-reference
  [plugins.inputs.minifierOptions]
    collapseWhitespace = true
    conservativeCollapse = true
    minifyCSS = true
    minifyJS = true

[[redirects]]
  from = "/blog/*"
  to = "https://glimpsingza.wordpress.com/:splat"
  status = 302
  force = true

  name: Experience
  id: experiences
  enable: true
  weight: 3
  showOnNavbar: true

# THE CAREER HISTORY USED TO LIVE HERE. It now comes from the record.
#
# layouts/partials/sections/experiences.html builds it from data/presence.json,
# fetched from github.com/gotreasa/presence before every build. Twelve roles were
# duplicated between this file and the career record, and duplicated values
# drift: this file carried a Freelance role that never existed, two wrong start
# dates and a superseded 2,000% figure until 29 Aug 2026.
#
# THE SPLIT: the record owns employers, role titles, dates and what each role
# did. This file owns the section's own settings below, and the template owns
# ordering and grouping.
#
# WHY THE TEMPLATE HAS TO GROUP. The artifact stores experience FLAT, one entry
# per role, each carrying `via`: the id of the entry whose employer made it
# possible. Rendered as-is that shows BriX Consulting as two separate employers
# and IBM as eight. The template groups by employer, which is the whole reason it
# is vendored.
#
# Adding a role here would do nothing. Add it to the record and publish a new tag.

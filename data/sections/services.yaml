section:
  name: Services
  id: services
  enable: true
  weight: 2
  showOnNavbar: true

# The summaries USED TO LIVE HERE and now come from the record.
#
# layouts/partials/sections/services.html merges each name below with the
# summary carried in data/presence.json, fetched from
# github.com/gotreasa/presence before every build. The wording was identical in
# both places, which is the kind of duplication that stops being identical the
# moment one of them is edited.
#
# THE SPLIT: this file decides WHICH services appear, in what ORDER and at which
# ROUTE. The record decides what each is CALLED and what it SAYS. Changing a
# summary here would do nothing; change it in the record and publish a new tag.
#
# `name` is the join between the two. A name the record does not know FAILS THE
# BUILD rather than rendering a card with no summary.

services:
  - name: Software Craftsmanship Coach
    url: /services/software-craftsmanship-coach

  - name: DevOps Coach
    url: /services/devops-coach

  - name: Software Development Consultant
    url: /services/software-development-consultant

  - name: DevOps Consultant
    url: /services/devops-consultant

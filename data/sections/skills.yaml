section:
  name: Skills
  id: skills
  enable: true
  weight: 5
  showOnNavbar: true

# The summaries USED TO LIVE HERE and now come from the record (21 Oct 2026).
#
# layouts/partials/sections/skills.html merges each name below with the summary
# carried in data/presence.json (`site_skills`), fetched from
# github.com/gotreasa/presence before every build. Skills was the one section not
# sourced from the record, and it drifted (A3; Anvil's audit in
# docs/acumen/home/audit-section-skills.md scored it 29.5/100).
#
# THE SPLIT: this file decides WHICH cards appear, in what ORDER and with which
# ICON. The record decides what each is CALLED and what it SAYS. `name` is the
# join, and a name the record does not know FAILS THE BUILD.
#
# Since 21 Oct 2026 the cards describe skill areas, not the Services offers, at
# Gearoid's word ("The skills is meant to describe the skills that I have"), so
# they carry no links. Icons are Font Awesome glyphs that take the heading
# colour in light and dark mode (docs/acumen/home/component-skill-card-icons.md);
# a `logo:` key would win over `icon:`, so none is set.

skills:
  - name: Agentic engineering and AI-assisted development
    icon: fa-solid fa-robot

  - name: Software craftsmanship and Extreme Programming
    icon: fa-solid fa-hammer

  - name: Software architecture and API design
    icon: fa-solid fa-diagram-project

  - name: Continuous delivery and DevOps
    icon: fa-solid fa-infinity

  - name: Coaching, mentoring and training
    icon: fa-solid fa-chalkboard-user

  - name: Languages
    icon: fa-solid fa-code

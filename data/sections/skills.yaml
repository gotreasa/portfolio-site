  - name: Git
    logo: /images/sections/skills/git.png
    summary: >-
      Experienced with git-based development (using the command-line interface). Mostly uses GitHub.
    url: 'https://git-scm.com/'

  - name: Other technologies
    logo: /images/sections/skills/technology.svg
    summary: >-
      Varying experience in HTML, CSS, JavaScript, TypeScript, Java,
      Python, C, C++, and SQL.

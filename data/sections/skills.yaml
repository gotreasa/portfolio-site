  enable: true
  weight: 5
  showOnNavbar: true

# The summaries USED TO LIVE HERE and now come from the record (21 Oct 2026).
#
# layouts/partials/sections/skills.html merges each name below with the summary
# carried in data/presence.json (`site_skills`), fetched from
# github.com/gotreasa/presence before every build. Skills was the one section not
# sourced from the record, and it drifted (A3; Anvil's audit in
# docs/acumen/home/audit-section-skills.md scored it 29.5/100).
#
# THE SPLIT: this file decides WHICH cards appear, in what ORDER, with which
# LOGO and LINK. The record decides what each is CALLED and what it SAYS. `name`
# is the join, and a name the record does not know FAILS THE BUILD. The four
# offer cards follow the Services order and link to their pages; Languages has
# no link (Anvil's R9).

skills:
  - name: Agentic engineering and AI developer tooling
    logo: /images/sections/skills/technology.svg
    url: /services/agentic-engineering/

  - name: Principal software engineering
    logo: /images/sections/skills/oop.svg
    url: /services/principal-software-engineering/

  - name: Technical coaching and training
    logo: /images/sections/skills/xp.svg
    url: /services/technical-coaching-and-training/

  - name: DevOps
    logo: /images/sections/skills/docker.svg
    url: /services/devops/

  - name: Languages
    logo: /images/sections/skills/tools.svg

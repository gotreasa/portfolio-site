skills:
  - name: Software Craftsmanship
    logo: /images/sections/skills/tools.svg
    summary: >-
      Has a deep understanding of software engineering principles and best practices including agile,
      design patterns, hexagonal architecture, clean code, refactoring, and domain-driven design.

  - name: Extreme Programming
    logo: /images/sections/skills/xp.svg
    summary: >-
      Applies and trains Extreme Programming (XP) techniques, such as direct client communication, pair
      programming, test-driven development (TDD), behaviour-driven development (BDD), continuous
      integration and continuous delivery (CI/CD), team code ownership, and coding standards.

  - name: Cloud
    logo: /images/sections/skills/cloud.png
    summary: >-
      Fond of distributed architectural patterns and technologies. Worked with IBM Cloud.

  - name: Docker
    logo: /images/sections/skills/docker.svg
    summary: >-
      Builds most applications to run in containers. Prefers containerized development.
      Experienced with multi-stage, multi-arch build process.
    url: 'https://www.docker.com/'

  # - name: Linux
  #   logo: /images/sections/skills/linux.png

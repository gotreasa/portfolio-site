# The awards come from the record.
#
# layouts/partials/sections/accomplishments.html builds them from
# data/presence.json, fetched from github.com/gotreasa/presence before every
# build. The descriptions were authored into ssot/awards.md on 30 Aug 2026 from
# the citations in section 6 of career-history.md, which is how the 2017 one got
# fixed: the version that used to live here credited that award with a
# deal-registration time and a 90% cost cut belonging to two different pieces of
# work in different years.
#
# THE SPLIT: the record owns the title, issuer, year and description. What stays
# below is the issuer URL, which is a route the site owns. Editing an award here
# would do nothing.

accomplishments:
  - organization:
      name: IBM
      url: https://ibm.com/
